name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (arena + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  validate-submissions:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (arena only, ランタイム最小)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Validate submissions
        run: python scripts/validate_submission.py --games 4
      - name: Smoke tournament (when 2+ submissions exist)
        if: ${{ always() }}
        run: |
          for env in tictactoe othello connect4; do
            count=$(find "submissions/$env" -mindepth 2 -maxdepth 2 -name meta.json 2>/dev/null | wc -l)
            if [ "$count" -ge 2 ]; then
              echo "::group::$env tournament"
              python -m arena.cli tournament --env "$env" --dir "submissions/$env" --games 2 --include-random
              echo "::endgroup::"
            fi
          done

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-arena"
version = "0.1.0"
description = "Community RL battle arena: train models, push them, fight them."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RL Arena Community" }]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "stable-baselines3[extra]>=2.4.0",
    "gymnasium>=1.0.0",
]
pmml = [
    "pypmml>=0.9.17",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
rl-arena = "arena.cli:main"

[tool.setuptools.packages.find]
include = ["arena*", "envs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
